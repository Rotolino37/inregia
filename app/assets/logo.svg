<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2547"/><stop offset=".55" stop-color="#0E1530"/><stop offset="1" stop-color="#070B1A"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3D9A0" stop-opacity=".85"/><stop offset=".5" stop-color="#C9A45C" stop-opacity=".25"/><stop offset="1" stop-color="#8C6A2F" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46E0CF"/><stop offset=".55" stop-color="#2F9BFF"/><stop offset="1" stop-color="#4B5BFF"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D3E73"/><stop offset="1" stop-color="#1C2752"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE7B0"/><stop offset=".45" stop-color="#E2BC6E"/><stop offset="1" stop-color="#A97A2E"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".72" cy=".72" r=".45">
      <stop offset="0" stop-color="#E2BC6E" stop-opacity=".35"/><stop offset="1" stop-color="#E2BC6E" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".45"/></filter>
    <filter id="sh2" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".55"/></filter>
    <clipPath id="cc"><rect x="96" y="150" width="250" height="176" rx="20"/></clipPath>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#glow)"/>
  <rect x="19" y="19" width="474" height="474" rx="105" fill="none" stroke="url(#rim)" stroke-width="5"/>
  <!-- deck -->
  <g transform="rotate(-10 222 238)" opacity=".55"><rect x="120" y="118" width="250" height="176" rx="20" fill="url(#card2)" stroke="#5B6FB0" stroke-opacity=".5" stroke-width="2"/></g>
  <g transform="rotate(-5 222 238)" opacity=".8" filter="url(#sh)"><rect x="108" y="134" width="250" height="176" rx="20" fill="url(#card2)" stroke="#7B8FD0" stroke-opacity=".5" stroke-width="2"/></g>
  <g filter="url(#sh)">
    <rect x="96" y="150" width="250" height="176" rx="20" fill="url(#card)"/>
    <g clip-path="url(#cc)">
      <rect x="96" y="150" width="250" height="88" fill="url(#gloss)"/>
      <!-- equalizer bars -->
      <g fill="#fff" fill-opacity=".95">
        <rect x="128" y="250" width="22" height="48" rx="6"/>
        <rect x="162" y="214" width="22" height="84" rx="6"/>
        <rect x="196" y="232" width="22" height="66" rx="6"/>
        <rect x="230" y="196" width="22" height="102" rx="6"/>
        <rect x="264" y="240" width="22" height="58" rx="6"/>
      </g>
      <rect x="128" y="178" width="96" height="10" rx="5" fill="#fff" fill-opacity=".55"/>
    </g>
  </g>
  <!-- music note -->
  <g filter="url(#sh2)">
    <path d="M332 366 L332 170 L428 142 L428 336" fill="none" stroke="#E2BC6E" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M332 170 L428 142 L428 186 L332 214 Z" fill="url(#gold)"/>
    <ellipse cx="300" cy="372" rx="44" ry="34" transform="rotate(-20 300 372)" fill="url(#gold)"/>
    <ellipse cx="398" cy="342" rx="44" ry="34" transform="rotate(-20 398 342)" fill="url(#gold)"/>
    <ellipse cx="290" cy="362" rx="16" ry="8" transform="rotate(-20 290 362)" fill="#fff" fill-opacity=".45"/>
    <ellipse cx="388" cy="332" rx="16" ry="8" transform="rotate(-20 388 332)" fill="#fff" fill-opacity=".45"/>
  </g>
</svg>
